persist-state: true

bypass-operators: true

motd:
  enabled: true
  text: "<red><bold>Server under maintenance</bold></red>\n<gray>We will be back soon.</gray>"

countdown-announcements: [10m, 5m, 1m, 30s, 10s, 5s, 3s, 2s, 1s]

messages:
  prefix: "<gray>[<gold>Maintenance</gold>]</gray>"
  enabled: "<prefix> <yellow>Maintenance mode is now <green>enabled</green>.</yellow>"
  enabled-timed: "<prefix> <yellow>Maintenance mode is now <green>enabled</green> for <duration>.</yellow>"
  disabled: "<prefix> <yellow>Maintenance mode is now <red>disabled</red>.</yellow>"
  already-enabled: "<prefix> <red>Maintenance mode is already enabled.</red>"
  already-disabled: "<prefix> <red>Maintenance mode is already disabled.</red>"
  status-off: "<prefix> <yellow>Maintenance mode is <red>off</red>.</yellow>"
  status-on: "<prefix> <yellow>Maintenance mode is <green>on</green>.</yellow>"
  status-on-timed: "<prefix> <yellow>Maintenance mode is <green>on</green> and ends in <remaining>.</yellow>"
  kick: "<red><bold>Server maintenance</bold></red>\n<gray>The server entered maintenance mode. Please come back later.</gray>"
  login-denied: "<red><bold>Server under maintenance</bold></red>\n<gray>Please try again later.</gray>"
  countdown: "<prefix> <yellow>Maintenance ends in <remaining>.</yellow>"
  expired: "<prefix> <green>Maintenance is over. The server is open again.</green>"
  no-permission: "<red>You do not have permission to do that.</red>"
  usage: "<prefix> <yellow>Usage:</yellow>\n<gray>/maintenance on [duration]\n/maintenance off\n/maintenance status\n/maintenance reload\n/maintenance whitelist (add|remove|list) [player]</gray>"
  invalid-duration: "<prefix> <red>Invalid duration '<input>': <reason>.</red>"
  reload-success: "<prefix> <green>Configuration reloaded.</green>"
  reload-warnings: "<prefix> <green>Configuration reloaded</green> <yellow>with <count> warning(s). See the console.</yellow>"
  reload-failed: "<prefix> <red>Reload failed, the previous configuration is still active: <error></red>"
  whitelist-added: "<prefix> <green><player> was added to the maintenance whitelist.</green>"
  whitelist-already: "<prefix> <red><player> is already on the maintenance whitelist.</red>"
  whitelist-removed: "<prefix> <yellow><player> was removed from the maintenance whitelist.</yellow>"
  whitelist-not-listed: "<prefix> <red><player> is not on the maintenance whitelist.</red>"
  player-unknown: "<prefix> <red>Unknown player '<player>'. Use an online player, a player who joined before, or a UUID.</red>"
  whitelist-header: "<prefix> <yellow>Maintenance whitelist (<count>):</yellow>"
  whitelist-entry: "<gray> - <white><player></white></gray>"
  whitelist-empty: "<prefix> <yellow>The maintenance whitelist is empty.</yellow>"
